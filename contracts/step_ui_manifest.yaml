forms:
- operation_id: process_document
  title: Extract PDF text and schema-guided data
  section: Mistral Document AI
  fields:
  - name: artifact_handle
    widget_type: artifact_picker
    label: PDF document artifact
    required: true
    help_text: Map a PDF artifact from an earlier workflow step, maximum 20 MiB. Other file formats are not accepted.
  - name: table_format
    widget_type: select
    label: Table output format
    help_text: Choose inline Markdown (default), separate Markdown tables or separate HTML tables in the full result.
    options:
    - label: Inline Markdown
      value: inline
    - label: Separate Markdown tables
      value: markdown
    - label: Separate HTML tables
      value: html
  - name: schema
    widget_type: json
    label: Extraction JSON Schema
    help_text: Optional Draft 2020-12 object schema up to 64 KiB, without references. Applies to the whole document.
      Inline structured data may be omitted for size, complexity or protected credential fields; the complete result
      remains in the artifact.
    placeholder: '{"type":"object","properties":{"invoice_number":{"type":"string"},"total":{"type":"number"}},"required":["invoice_number","total"]}'
