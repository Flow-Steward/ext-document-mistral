connection_types:
  - connection_type_id: mistral_document
    display_name: Mistral Document AI
    description: Project-scoped Mistral API key.
    config_schema:
      type: object
      additionalProperties: false
      properties:
        request_timeout_seconds: {type: integer, title: Request timeout seconds, minimum: 1, maximum: 240, default: 120}
    secret_schema:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: {type: string, title: Mistral API key, minLength: 1}
    capabilities: {test_connection: false, live_request: true, workflow_trigger: false, callback_ingress: false}
    safety_profile: {uses_standard_http_sdk: true, follows_redirects: false, stores_secret_values: false}
