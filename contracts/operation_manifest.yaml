operations:
- operation_id: process_document
  display_name: Extract PDF text and schema-guided data
  description: Send a PDF artifact to Mistral OCR to extract text, tables and optional data matching a supplied
    JSON Schema. Returns bounded inline text/data plus a complete result artifact; select a Mistral connection and
    review extracted values before use.
  operation_kind: action
  category: document_extraction
  connection_type_ids:
  - mistral_document
  inputs:
  - name: artifact_handle
    value_type: artifact_handle
    required: true
    display_name: PDF document artifact
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: table_format
    value_type: text
    required: false
    display_name: Table output format
  - name: schema
    value_type: object
    required: false
    display_name: Extraction JSON Schema
  outputs:
  - name: result_artifact_handle
    value_type: artifact_handle
  - name: text
    value_type: text
  - name: text_truncated
    value_type: boolean
  - name: structured
    value_type: object
    schema:
      type:
      - object
      - 'null'
  - name: structured_omitted
    value_type: boolean
  - name: structured_omission_reason
    value_type: text
  - name: request_id
    value_type: text
  result_fields:
  - result.result_artifact_handle
  - result.text
  - result.text_truncated
  - result.structured
  - result.structured_omitted
  - result.structured_omission_reason
  - result.request_id
  error_codes:
  - invalid_payload
  - invalid_connection
  - input_too_large
  - artifact_access_failed
  - provider_request_failed
  - provider_http_error
  - invalid_provider_response
  - output_too_large
