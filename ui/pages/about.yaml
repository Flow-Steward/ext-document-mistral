page_id: about
title: About
components:
  - component_id: mistral_about
    type: markdown
    title: Mistral Document AI
    body: |
      Extract text, layout blocks and tables from a PDF using Mistral Document AI. Optionally provide a JSON Schema to extract structured data.

      **Before you begin:** Use Flow Steward 1.4 or later. Create a Mistral account, enable API access and billing as required, and create an API key in https://console.mistral.ai/ . Requests send your PDF to Mistral and may incur charges.

      **Connect:** Open Configuration, add a connection, enter the API key and save. The key is stored as a project connection secret.

      **Use:** Add Process document to a workflow, select the connection and a PDF artifact, and optionally choose table output or provide a Draft 2020-12 object JSON Schema without references. Later steps can use the returned text, structured object or full JSON result artifact.

      **Limits:** PDFs up to 20 MiB. Schema extraction processes the whole document. Inline text may be truncated (`text_truncated`). Large or complex structured data, and objects with credential-like field names, are omitted inline (`structured_omitted` is true, `structured` is null, and `structured_omission_reason` explains why). The host blocks results reflecting the connection secret; avoid documents containing the API key. The full response and annotation are in the result artifact. Review extracted values before relying on them.
