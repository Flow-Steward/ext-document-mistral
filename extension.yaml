manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.mistral-document
kind: tool_provider
version: 0.1.4
display_name: Mistral Document AI
description: |-
  Turn PDF artifacts into text and structured data for document review and processing workflows with Mistral Document AI. The action uses Mistral's OCR service. Supply a JSON Schema when you want document data organized into named fields, or use the text output directly in later workflow steps. A complete JSON result is also saved as an artifact.

  Choose whether tables appear as inline Markdown, separate Markdown or HTML tables. The schema-guided extraction applies to the whole document, making the action useful for preparing invoice data, document summaries or review inputs before your own workflow applies business rules. The operation returns a provider request ID, a text-truncation flag and, when relevant, a reason why structured data was omitted from the inline result.

  PDF input is limited to 20 MiB. Inline text and structured data each have 128 KiB JSON-encoded limits, while the complete result artifact can be up to 50 MiB. Some structured results therefore need to be read from the artifact. Document contents are sent to Mistral, and provider access and billing apply. Review extracted values before acting on them.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-document-mistral/issues
  website_url: https://github.com/Flow-Steward/ext-document-mistral
listing:
  category: data
  tags:
  - mistral
  - ocr
  - document-extraction
  summary: Extract PDF text, table content and optional schema-guided data with Mistral OCR, preserving the complete
    JSON result.
  setup_summary: Create a project-scoped Mistral API connection using a key from the Mistral console and select
    a PDF artifact in the Process document step. Mistral API access and any required billing must be enabled.
features: [tool, action]
required_scopes: [extension:invoke, artifact:read, artifact:write]
machine_auth:
  service_account_key: svc_ext_mistral_document
  required_scopes: [extension:invoke, artifact:read, artifact:write]
account_scope:
  scope_type: project
  description: API keys are stored in project-scoped connection secrets.
runtime:
  contract_version: extension_host_v2
  compatibility: {platform_min: 1.4.0}
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifact_policies:
  - operation_id: process_document
    inputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: source_document, field: artifact_handle, required: true, max_size_bytes: 20971520}
    outputs:
      - {kind: artifact, binding_key: result_artifact_handle, filename: mistral-result.json, content_type: application/json, max_size_bytes: 52428800, retention_class: run_window}
entrypoint:
  mode: subprocess
  command: [python3, main.py]
  timeout_seconds: 300
health:
  command: [python3, health.py]
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements:
- name: attrs
  version: 26.1.0
  hashes:
  - sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
- name: jsonschema
  version: 4.26.0
  hashes:
  - sha256:d489f15263b8d200f8387e64b4c3a75f06629559fb73deb8fdfb525f2dab50ce
- name: jsonschema-specifications
  version: 2025.9.1
  hashes:
  - sha256:98802fee3a11ee76ecaca44429fda8a41bff98b00a0f2838151b113f210cc6fe
- name: referencing
  version: 0.37.0
  hashes:
  - sha256:381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231
- name: rpds-py
  version: 2026.9.1
  hashes:
  - sha256:2693b2728bbcc48d09a981a356954b0c47c53ff25b545856f28a889ea619f69a
  - sha256:addeda51556dac7c1a2f14cda62db8b621cd12afba3091d03a96c72932387eab
- name: typing-extensions
  version: 4.16.0
  hashes:
  - sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
egress:
  hosts: [api.mistral.ai]
external_effects:
  - operation_id: process_document
    effect_kind: paid_api_call
    channel: mistral
    idempotency: required
    test_mode_behavior: suppress
