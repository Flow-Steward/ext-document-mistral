schema_version: extension_descriptor_v1
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.mistral-document
release_version: 0.1.5
extension_type: service_extension
identity:
  display_name: Mistral Document AI
  description: 'Turn PDF artifacts into text and structured data for document review and processing workflows with
    Mistral Document AI. The action uses Mistral''s OCR service. Supply a JSON Schema when you want document data
    organized into named fields, or use the text output directly in later workflow steps. A complete JSON result
    is also saved as an artifact.


    Choose whether tables appear as inline Markdown, separate Markdown or HTML tables. The schema-guided extraction
    applies to the whole document, making the action useful for preparing invoice data, document summaries or review
    inputs before your own workflow applies business rules. The operation returns a provider request ID, a text-truncation
    flag and, when relevant, a reason why structured data was omitted from the inline result.


    PDF input is limited to 20 MiB. Inline text and structured data each have 128 KiB JSON-encoded limits, while
    the complete result artifact can be up to 50 MiB. Some structured results therefore need to be read from the
    artifact. Document contents are sent to Mistral, and provider access and billing apply. Review extracted values
    before acting on them.'
  tags:
  - mistral
  - ocr
  - document-extraction
vendor: {vendor_name: Flow Steward, support_url: 'https://github.com/Flow-Steward/ext-document-mistral/issues'}
listing: {visibility: public_reference, category: data}
distribution: {channel: private_byo, execution_modes: [local], allows_self_hosted: true, requires_connected_control_plane: false, import_sources: [file]}
runtime:
  contract_version: extension_host_v2
  compatibility: {platform_min: 1.4.0}
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
artifacts:
  extensions:
  - extension_id: flowsteward.mistral-document
    ref: extension.yaml
    publish: true
provenance: {origin: imported, notes: Bundle-local contracts.}
commerce: {billing_mode: free}
